[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-ai-studio"
version = "0.1.0"
description = "Créer, rigger et animer des personnages 3D avec l'IA et Blender, depuis une interface de bureau."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "keyring>=24",
]

[project.optional-dependencies]
# Jev (TypeSafe), le modèle de décision de l'article ; installé par défaut par install.sh
jev = ["typesafe-sdk>=0.7"]
test = ["bpy"]

[project.gui-scripts]
blender-ai-studio = "blender_ai_studio.app:main"

[tool.setuptools.packages.find]
include = ["blender_ai_studio*"]

[tool.setuptools.package-data]
blender_ai_studio = [
    "ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg",
    "ui/vendor/three/*", "ui/vendor/three/addons/*/*", "ui/vendor/fonts/*",
    "blender_side/*.py", "servers/*.py",
]
